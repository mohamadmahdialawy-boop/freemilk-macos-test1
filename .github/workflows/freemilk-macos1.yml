          elif [[ -n "$PKG_PATH" ]]; then
            echo "Found installer package: $(basename "$PKG_PATH")"
            sudo installer -pkg "$PKG_PATH" -target /
            APP_PATH="$(find /Applications -maxdepth 3 -type d \( -iname '*freemilk*.app' -o -iname '*milq*.app' \) -print -quit || true)"
            if [[ -z "$APP_PATH" ]]; then
              echo "The package installed, but the app bundle was not found in /Applications."
              find /Applications -maxdepth 2 -type d -name '*.app' -print | tail -30
              exit 1
            fi
            echo "FREEMILK_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          else
            echo "No .app or .pkg installer was found in the official DMG. Contents:"
            find "$MOUNT" -maxdepth 4 -print | head -100
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi

          hdiutil detach "$MOUNT" -quiet
          echo "FreeMilk installer was copied/installed."

      - name: Install and configure RustDesk remote desktop
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${RUSTDESK_PASSWORD:-}" ]]; then
            echo "Missing repository secret: RUSTDESK_PASSWORD"
            exit 1
          fi
          echo "::add-mask::$RUSTDESK_PASSWORD"

          # Pinned official RustDesk release for Apple Silicon.
          VERSION="1.5.3"
          DMG="$RUNNER_TEMP/rustdesk.dmg"
          MOUNT="$RUNNER_TEMP/rustdesk-mount"
          mkdir -p "$MOUNT"

          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/rustdesk/rustdesk/releases/download/${VERSION}/rustdesk-${VERSION}-aarch64.dmg" \
            --output "$DMG"

          hdiutil attach "$DMG" -readonly -nobrowse -quiet -mountpoint "$MOUNT"
          RD_APP_PATH="$(find "$MOUNT" -maxdepth 4 -type d -name 'RustDesk.app' -print -quit || true)"
          if [[ -z "$RD_APP_PATH" ]]; then
            echo "RustDesk.app was not found in its DMG."
            find "$MOUNT" -maxdepth 4 -print | head -80
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi

          sudo ditto "$RD_APP_PATH" /Applications/RustDesk.app
          hdiutil detach "$MOUNT" -quiet

          RD_BIN="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          if [[ ! -x "$RD_BIN" ]]; then
            echo "RustDesk command-line executable was not found: $RD_BIN"
            exit 1
          fi

          # Start the app, set a permanent password, and obtain its ID.
          open -a /Applications/RustDesk.app || true
          sleep 12
          sudo "$RD_BIN" --password "$RUSTDESK_PASSWORD" >/dev/null 2>&1
          sleep 5

          RD_ID="$("$RD_BIN" --get-id 2>/dev/null | tr -d '\r\n' || true)"
          if [[ -z "$RD_ID" ]]; then
            echo "RustDesk did not return an ID. Check the job log and runner connectivity."
            exit 1
          fi

          echo "RUSTDESK_ID=$RD_ID" >> "$GITHUB_ENV"
          {
            echo "## Remote Mac connection"
            echo
            echo "- **RustDesk ID:** $RD_ID"
            echo "- **Password:** use the value saved as the repository secret RUSTDESK_PASSWORD"
            echo "- **Client:** install RustDesk on Windows and connect using this ID and password."
            echo
            echo "> Keep this workflow run open while connected. The runner is temporary."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RustDesk ID: $RD_ID"
          echo "Password is stored in GitHub Secrets and is not printed."

      - name: Launch FreeMilk
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${FREEMILK_APP_PATH:-}" || ! -d "$FREEMILK_APP_PATH" ]]; then
            echo "FreeMilk app bundle path is missing."
            exit 1
          fi
          echo "Launching: $FREEMILK_APP_PATH"
          open "$FREEMILK_APP_PATH"
          sleep 15
          pgrep -afil 'FreeMilk|Milq' || true
          echo "FreeMilk launch command completed."

      - name: Keep the temporary Mac session alive
        shell: bash
        env:
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: |
          set -Eeuo pipefail
          TOTAL_MINUTES=$((SESSION_HOURS * 60))
          for ((minute = 1; minute <= TOTAL_MINUTES; minute++)); do
            sleep 60
            echo "Mac session active: ${minute}/${TOTAL_MINUTES} minutes"
          done

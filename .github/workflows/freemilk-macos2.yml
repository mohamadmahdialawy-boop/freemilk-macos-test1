name: FreeMilk macOS Development Session

on:
  push:
    paths:
      - ".github/run-macos-session-20261124"
  workflow_dispatch:
    inputs:
      session_hours:
        description: "Session length in hours (GitHub-hosted jobs have a 6-hour maximum)"
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: write

concurrency:
  group: freemilk-macos-session
  cancel-in-progress: true

jobs:
  freemilk-mac:
    name: FreeMilk macOS 26 (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify runner and graphical login session
        shell: bash
        run: |
          set -Eeuo pipefail
          sw_vers
          echo "Architecture: $(uname -m)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          df -h /
          echo "Runner user: $USER"
          GUI_UID="$(id -u)"
          if launchctl print "gui/$GUI_UID" >/dev/null 2>&1; then
            echo "GUI login session: available"
          else
            echo "GUI login session: not detected"
          fi

      - name: Prepare project workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/FreeMilkProject"
          mkdir -p "$PROJECT_DIR"
          if [[ ! -f "$PROJECT_DIR/README.md" ]]; then
            cat > "$PROJECT_DIR/README.md" <<'EOF'
          # FreeMilkProject

          Project workspace for macOS development.

          This repository is public. Do not commit passwords, API keys, private data,
          signing certificates, or other secrets.
          EOF
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          echo "Project workspace: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download and install FreeMilk for Mac
        shell: bash
        run: |
          set -Eeuo pipefail

          DMG="$RUNNER_TEMP/freemilk-mac.dmg"
          MOUNT="$RUNNER_TEMP/freemilk-mount"
          mkdir -p "$MOUNT"

          echo "Downloading the official FreeMilk Mac installer..."
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://www.freemilk.ai/download/mac" \
            --output "$DMG"

          file "$DMG"
          hdiutil attach "$DMG" -readonly -nobrowse -quiet -mountpoint "$MOUNT"

          APP_PATH="$(find "$MOUNT" -maxdepth 4 -type d -name '*.app' -print -quit || true)"
          PKG_PATH="$(find "$MOUNT" -maxdepth 4 -type f -name '*.pkg' -print -quit || true)"

          if [[ -n "$APP_PATH" ]]; then
            APP_NAME="$(basename "$APP_PATH")"
            DEST="/Applications/$APP_NAME"
            sudo ditto "$APP_PATH" "$DEST"
            echo "FREEMILK_APP_PATH=$DEST" >> "$GITHUB_ENV"
          elif [[ -n "$PKG_PATH" ]]; then
            sudo installer -pkg "$PKG_PATH" -target /
            APP_PATH="$(find /Applications -maxdepth 3 -type d \( -iname '*freemilk*.app' -o -iname '*milq*.app' \) -print -quit || true)"
            if [[ -z "$APP_PATH" ]]; then
              echo "Installer ran, but FreeMilk.app was not found."
              find /Applications -maxdepth 2 -type d -name '*.app' -print | tail -30
              hdiutil detach "$MOUNT" -quiet || true
              exit 1
            fi
            echo "FREEMILK_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          else
            echo "No .app or .pkg was found in the downloaded DMG."
            find "$MOUNT" -maxdepth 4 -print | head -100
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi

          hdiutil detach "$MOUNT" -quiet
          echo "FreeMilk installation completed."

      - name: Install and connect Tailscale (explicit daemon socket)
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${TAILSCALE_AUTHKEY:-}" ]]; then
            echo "Missing GitHub Secret: TAILSCALE_AUTHKEY"
            exit 1
          fi
          echo "::add-mask::$TAILSCALE_AUTHKEY"

          echo "Installing the CLI-only Tailscale package..."
          brew install tailscale

          TS_PREFIX="$(brew --prefix tailscale)"
          TS_BIN="$TS_PREFIX/bin/tailscale"
          TS_DAEMON="$TS_PREFIX/bin/tailscaled"
          if [[ ! -x "$TS_BIN" || ! -x "$TS_DAEMON" ]]; then
            echo "Tailscale binaries were not found under $TS_PREFIX"
            exit 1
          fi

          TS_DIR="$RUNNER_TEMP/tailscale"
          mkdir -p "$TS_DIR"
          chmod 700 "$TS_DIR"
          TS_SOCKET="$TS_DIR/tailscaled.sock"
          TS_STATE="$TS_DIR/tailscaled.state"
          TS_LOG="$TS_DIR/tailscaled.log"

          echo "Starting tailscaled directly with a dedicated socket and state file..."
          sudo nohup "$TS_DAEMON" \
            --state="$TS_STATE" \
            --socket="$TS_SOCKET" \
            --tun=utun \
            --port=41641 \
            > "$TS_LOG" 2>&1 < /dev/null &
          TS_PID=$!
          echo "TAILSCALED_PID=$TS_PID" >> "$GITHUB_ENV"
          echo "TAILSCALE_SOCKET=$TS_SOCKET" >> "$GITHUB_ENV"

          READY=0
          for attempt in $(seq 1 45); do
            # Before authentication, tailscale status normally prints "Logged out."
            # and exits non-zero. That response proves the daemon's LocalAPI is ready.
            STATUS_OUTPUT="$(sudo "$TS_BIN" --socket="$TS_SOCKET" status 2>&1 || true)"
            if [[ "$STATUS_OUTPUT" == *"Logged out."* ]] || [[ "$STATUS_OUTPUT" == *"BackendState"* ]]; then
              READY=1
              echo "Tailscale LocalAPI is responding; pre-authentication state is expected."
              break
            fi
            if ! sudo kill -0 "$TS_PID" >/dev/null 2>&1; then
              echo "tailscaled process exited before its control socket became ready."
              break
            fi
            if (( attempt % 10 == 0 )); then
              echo "Waiting for Tailscale LocalAPI ($attempt/45): ${STATUS_OUTPUT:-no response}"
            fi
            sleep 2
          done

          if [[ "$READY" -ne 1 ]]; then
            echo "Tailscale daemon did not become ready. Diagnostic output follows:"
            tail -100 "$TS_LOG" || true
            ps aux | grep '[t]ailscaled' || true
            ls -la "$TS_DIR" || true
            exit 1
          fi

          echo "Tailscale control socket is responding. Authenticating..."
          sudo "$TS_BIN" --socket="$TS_SOCKET" up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="freemilk-mac-$GITHUB_RUN_ID" \
            --accept-dns=false

          echo "Waiting for network readiness..."
          sudo "$TS_BIN" --socket="$TS_SOCKET" wait --timeout=90s

          TS_IP="$(sudo "$TS_BIN" --socket="$TS_SOCKET" ip -4 | head -n 1 | tr -d '\r\n')"
          if [[ -z "$TS_IP" ]]; then
            echo "Tailscale connected but did not return an IPv4 address."
            sudo "$TS_BIN" --socket="$TS_SOCKET" status || true
            tail -100 "$TS_LOG" || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale network is ready."
          echo "Tailscale IPv4: $TS_IP"
          sudo "$TS_BIN" --socket="$TS_SOCKET" status || true

          {
            echo "## Private Mac connection"
            echo
            echo "- **Tailscale IPv4:** \`$TS_IP\`"
            echo "- **RustDesk Direct IP endpoint:** \`$TS_IP:21118\`"
            echo "- **RustDesk password:** the value you configured in repository secret \`RUSTDESK_PASSWORD\`"
            echo
            echo "### Connect from Android"
            echo
            echo "1. Install Tailscale on the phone and sign in to the same Tailscale account."
            echo "2. Install RustDesk from F-Droid or the official GitHub releases."
            echo "3. In RustDesk, enter the Tailscale IPv4 address with port 21118: \`$TS_IP:21118\`."
            echo "4. Enter the password configured in repository secret \`RUSTDESK_PASSWORD\`."
            echo "5. Use Mouse mode or Touch mode and the on-screen keyboard."
            echo
            echo "Keep this workflow run active while connected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install and configure RustDesk Direct IP
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${RUSTDESK_PASSWORD:-}" ]]; then
            echo "Missing GitHub Secret: RUSTDESK_PASSWORD"
            exit 1
          fi
          echo "::add-mask::$RUSTDESK_PASSWORD"

          VERSION="1.5.3"
          DMG="$RUNNER_TEMP/rustdesk.dmg"
          MOUNT="$RUNNER_TEMP/rustdesk-mount"
          mkdir -p "$MOUNT"

          echo "Downloading RustDesk $VERSION for Apple Silicon..."
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/rustdesk/rustdesk/releases/download/$VERSION/rustdesk-$VERSION-aarch64.dmg" \
            --output "$DMG"

          file "$DMG"
          hdiutil attach "$DMG" -readonly -nobrowse -quiet -mountpoint "$MOUNT"
          RD_APP_PATH="$(find "$MOUNT" -maxdepth 4 -type d -name 'RustDesk.app' -print -quit || true)"

          if [[ -z "$RD_APP_PATH" ]]; then
            echo "RustDesk.app was not found in its DMG."
            find "$MOUNT" -maxdepth 4 -print | head -80
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi

          sudo ditto "$RD_APP_PATH" /Applications/RustDesk.app
          hdiutil detach "$MOUNT" -quiet

          RD_CONFIG_DIR="$HOME/Library/Preferences/com.carriez.RustDesk"
          mkdir -p "$RD_CONFIG_DIR"
          chmod 700 "$RD_CONFIG_DIR"

          cat > "$RD_CONFIG_DIR/RustDesk2.toml" <<'TOML'
          [options]
          direct-server = 'Y'
          direct-access-port = '21118'
          allow-auto-disconnect = 'N'
          TOML
          chmod 600 "$RD_CONFIG_DIR/RustDesk2.toml"

          RD_BIN="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          if [[ ! -x "$RD_BIN" ]]; then
            echo "RustDesk executable was not found: $RD_BIN"
            exit 1
          fi

          FWCTL="/usr/libexec/ApplicationFirewall/socketfilterfw"
          if [[ -x "$FWCTL" ]]; then
            sudo "$FWCTL" --add /Applications/RustDesk.app || true
            sudo "$FWCTL" --unblockapp /Applications/RustDesk.app || true
          fi

          echo "Launching RustDesk in the logged-in GUI session..."
          open -a /Applications/RustDesk.app
          sleep 15

          # Configure the unattended password without printing it.
          if "$RD_BIN" --password "$RUSTDESK_PASSWORD" >/dev/null 2>&1; then
            echo "RustDesk password configuration command completed."
          elif sudo "$RD_BIN" --password "$RUSTDESK_PASSWORD" >/dev/null 2>&1; then
            echo "RustDesk password configuration command completed with elevated privileges."
          else
            echo "RustDesk password CLI configuration did not confirm success."
          fi

          RD_ID="$("$RD_BIN" --get-id 2>/dev/null | tr -d '\r\n' || true)"
          echo "RustDesk ID: ${RD_ID:-not returned}"
          echo "RustDesk process:"
          pgrep -afil 'RustDesk' || true

          LISTENING=0
          for attempt in $(seq 1 25); do
            if sudo lsof -nP -iTCP:21118 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN; then
              LISTENING=1
              break
            fi
            sleep 2
          done

          if [[ "$LISTENING" -eq 1 ]]; then
            echo "RustDesk Direct IP listener is active on TCP 21118."
          else
            echo "RustDesk did not open TCP 21118. Listener diagnostics:"
            sudo lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | head -50 || true
            echo "RustDesk must be inspected before a remote session can be considered ready."
            exit 1
          fi

          {
            echo
            echo "### RustDesk status"
            echo
            echo "- RustDesk Direct IP listener: **PASS** (TCP 21118)"
            echo "- RustDesk device ID: \`${RD_ID:-not returned}\`"
            echo "- RustDesk password: configured from repository secret; not printed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Launch FreeMilk and test internet access
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${FREEMILK_APP_PATH:-}" || ! -d "$FREEMILK_APP_PATH" ]]; then
            echo "FreeMilk application path is missing."
            exit 1
          fi

          echo "Launching $FREEMILK_APP_PATH"
          open "$FREEMILK_APP_PATH"
          sleep 15

          if pgrep -afil 'FreeMilk|Milq' >/dev/null 2>&1; then
            echo "FreeMilk process detected."
          else
            echo "FreeMilk process was not detected after launch."
            exit 1
          fi

          if curl --fail --silent --show-error --location --max-time 20 \
            --output /dev/null "https://claude.ai"; then
            echo "Claude website connectivity: PASS"
          else
            echo "Claude website connectivity: FAIL"
            exit 1
          fi

          {
            echo
            echo "### FreeMilk and network"
            echo
            echo "- FreeMilk process: **PASS**"
            echo "- Internet access to claude.ai: **PASS**"
            echo "- Project directory: \`$PROJECT_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check macOS screen-capture capability (diagnostic only)
        shell: bash
        run: |
          set -Eeuo pipefail
          SCREENSHOT="$RUNNER_TEMP/desktop-diagnostic.png"
          if screencapture -x "$SCREENSHOT" >/dev/null 2>&1 && [[ -s "$SCREENSHOT" ]]; then
            SIZE="$(stat -f%z "$SCREENSHOT")"
            echo "macOS screencapture command produced a file ($SIZE bytes)."
            echo "This does not by itself prove RustDesk has Screen Recording permission."
            echo "- macOS screencapture utility: **PASS** (file created; RustDesk TCC permissions remain unverified)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS screencapture utility could not produce a screenshot."
            echo "- macOS screencapture utility: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$SCREENSHOT"

      - name: Keep the development session alive
        shell: bash
        env:
          SESSION_HOURS: ${{ inputs.session_hours || '3' }}
        run: |
          set -Eeuo pipefail
          TOTAL_MINUTES=$((SESSION_HOURS * 60))
          echo "Development session is active for $TOTAL_MINUTES minutes."
          for ((minute = 1; minute <= TOTAL_MINUTES; minute++)); do
            sleep 60
            if (( minute % 5 == 0 )); then
              echo "Session active: $minute/$TOTAL_MINUTES minutes"
            fi
          done

      - name: Save project files back to GitHub
        if: always()
        shell: bash
        run: |
          set +e
          PROJECT_DIR="$GITHUB_WORKSPACE/FreeMilkProject"
          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "Project directory was not created; nothing to save."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add --all -- FreeMilkProject
          if git diff --cached --quiet; then
            echo "No project changes to save."
            exit 0
          fi
          git commit -m "Save macOS development session project files"
          git push origin "HEAD:main"
          RESULT=$?
          if [[ "$RESULT" -eq 0 ]]; then
            echo "Project files saved to GitHub."
          else
            echo "Project push failed. Files remain available only until this runner shuts down."
            exit "$RESULT"
          fi

      - name: Disconnect Tailscale and stop daemon
        if: always()
        shell: bash
        run: |
          set +e
          TS_BIN="$(brew --prefix tailscale 2>/dev/null)/bin/tailscale"
          if [[ -n "${TAILSCALE_SOCKET:-}" && -x "$TS_BIN" ]]; then
            sudo "$TS_BIN" --socket="$TAILSCALE_SOCKET" logout >/dev/null 2>&1 || true
          fi
          if [[ -n "${TAILSCALED_PID:-}" ]]; then
            sudo kill "$TAILSCALED_PID" >/dev/null 2>&1 || true
          fi
          sudo pkill -f '[t]ailscaled.*tailscale' >/dev/null 2>&1 || true
          echo "Tailscale cleanup attempted."
